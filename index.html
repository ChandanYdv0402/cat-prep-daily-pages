<!doctype html>
<html lang="en">
<head>
  <meta name="coding-feed" content="coding-data.json">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2e2e2e">
  <meta name="description" content="Chandan's coding activity, contest calendar, leaderboard and CAT practice.">
  <title>Coding · Chandan's dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="calendar.css">
  <link rel="stylesheet" href="coding.css">
  <script src="calendar.js" defer></script>
  <script src="coding-data.js" defer></script>
  <script src="coding.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="./"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>Chandan's dashboard</a>
      <nav class="primary-nav" aria-label="Main navigation">
        <a href="./" aria-current="page">Coding</a>
        <a href="cat.html">CAT</a>
      </nav>
    </div>
  </header>
  <main id="main" class="workspace coding-workspace">
    <section class="hero coding-hero" aria-labelledby="coding-title">
      <div class="hero-inner">
        <h1 id="coding-title">Coding</h1>
        <p class="hero-summary" id="coding-summary">LeetCode, CodeChef and Codeforces</p>
      </div>
      <section class="next-contest" aria-labelledby="next-title">
        <h2 id="next-title">Next contest</h2>
        <div id="contest-next"><p class="coding-message">Loading contests…</p></div>
      </section>
    </section>
    <div class="coding-layout">
      <div class="coding-main">
        <section aria-labelledby="profiles-title">
          <div class="section-heading coding-heading">
            <h2 id="profiles-title">My profiles</h2>
            <div class="coding-controls">
              <p id="coding-sync" class="coding-status" role="status">Fetching coding profiles…</p>
              <button id="coding-refresh" class="text-button" type="button">Refresh</button>
            </div>
          </div>
          <ul class="profile-grid" id="coding-profiles"></ul>
        </section>
        <section aria-labelledby="heatmap-title">
          <div class="section-heading coding-heading">
            <h2 id="heatmap-title">My solve activity</h2>
            <label class="coding-filter">Platform <select id="heatmap-platform">
              <option value="all">All platforms</option>
              <option value="leetcode">LeetCode</option>
              <option value="codechef">CodeChef</option>
              <option value="codeforces">Codeforces</option>
            </select></label>
          </div>
          <div class="heatmap-panel" id="coding-heatmap"></div>
        </section>
        <section aria-labelledby="leaderboard-title">
          <div class="section-heading coding-heading">
            <h2 id="leaderboard-title">Friends leaderboard</h2>
            <div class="leaderboard-filters">
              <label class="coding-filter">Rank by <select id="leaderboard-metric">
                <option value="solved">Problems solved</option>
                <option value="rating">Rating</option>
              </select></label>
              <label class="coding-filter">Platform <select id="leaderboard-platform">
                <option value="all">All platforms</option>
                <option value="leetcode">LeetCode</option>
                <option value="codechef">CodeChef</option>
                <option value="codeforces">Codeforces</option>
              </select></label>
            </div>
          </div>
          <div class="coding-table-wrap">
            <table class="coding-table">
              <thead><tr><th scope="col">Rank</th><th scope="col">Coder</th><th scope="col" id="leaderboard-stat" aria-sort="descending">Problems solved</th></tr></thead>
              <tbody id="coding-leaderboard"></tbody>
            </table>
          </div>
        </section>
      </div>
      <aside class="coding-sidebar" aria-label="Contest information">
        <section class="contest-panel" aria-labelledby="contest-calendar-title">
          <div class="section-heading">
            <h2 id="contest-calendar-title">Contest calendar</h2>
          </div>
          <div id="coding-calendar" class="month-calendar contest-calendar"></div>
          <div id="coding-calendar-day" class="cal-day" aria-live="polite"></div>
        </section>
        <section aria-labelledby="contest-list-title">
          <div class="section-heading">
            <h2 id="contest-list-title">Upcoming contests</h2>
            <span class="coding-status">IST</span>
          </div>
          <ul id="contest-list" class="contest-list"></ul>
        </section>
      </aside>
    </div>
  </main>
</body>
</html>
